name: SunriseAlarm
options:
  bundleIdPrefix: com.sunrisealarm
  deploymentTarget:
    iOS: "17.0"
targets:
  SunriseAlarm:
    type: application
    platform: iOS
    sources:
      - path: SunriseAlarm
    info:
      path: SunriseAlarm/Info.plist
      properties:
        CFBundleDisplayName: Sonnenaufgang
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: >-
          Die App berechnet den Sonnenaufgang an deinem aktuellen Standort, um den Wecker
          zur richtigen Zeit klingeln zu lassen.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Mit dauerhaftem Standortzugriff berechnet die App den Sonnenaufgang auch neu,
          wenn du reist, ohne dass die App geöffnet sein muss.
        UIBackgroundModes:
          - location
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.sunrisealarm.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunrisealarm.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
