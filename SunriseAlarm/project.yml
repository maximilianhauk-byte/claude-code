name: SunriseAlarm
options:
  bundleIdPrefix: com.example.sunrisealarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SunriseAlarm:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      properties:
        CFBundleDisplayName: "Sunrise Alarm"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Sunrise Alarm benötigt deinen Standort, um die genaue Sonnenaufgangszeit an deinem Ort zu berechnen."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sunrisealarm
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
schemes:
  SunriseAlarm:
    build:
      targets:
        SunriseAlarm: all
    run:
      config: Debug
